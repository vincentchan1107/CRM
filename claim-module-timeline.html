<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CLAIM MODULE 時間表 · 松本清 × ACHIEVER</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --gutter: 300px;
    --ink: #3e4750;
    --muted: #8b949e;
    --line: #e6ebf0;
    --teal: #2ea0b8;
    --bg: #f5f7f9;
    --paper: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    height: 100vh;
    overflow: hidden;
    color: var(--ink);
    background: var(--bg);
    font-family: Manrope, "Noto Sans TC", "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", "WenQuanYi Micro Hei", "Droid Sans Fallback", sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 16px 22px 12px;
    gap: 8px;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 28px;
  }
  .logo-link {
    display: inline-flex;
    align-items: center;
    margin-bottom: 6px;
    text-decoration: none;
  }
  .logo {
    display: block;
    height: 44px;
    width: auto;
  }
  h1 {
    margin: 2px 0 0;
    font-size: 36px;
    line-height: .95;
    letter-spacing: .055em;
    font-weight: 800;
    color: #5c6570;
  }
  .sub {
    margin-top: 6px;
    font-size: 14px;
    font-weight: 700;
    color: #7b868f;
    letter-spacing: .03em;
  }
  .client { width: min(440px, 40vw); }
  .kicker {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .16em;
    color: #9aa3ab;
  }
  .client-name {
    margin-top: 2px;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: .12em;
    line-height: 1.05;
    color: #3a434c;
  }
  .jp {
    margin-top: 2px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    color: #8d969e;
  }
  .client p {
    margin: 8px 0 0;
    color: #8e979f;
    font-size: 12px;
    line-height: 1.55;
    font-weight: 500;
  }
  .ribbon {
    display: flex;
    height: 4px;
    border-radius: 99px;
    overflow: hidden;
    flex: none;
  }
  .ribbon i { flex: 1; display: block; }
  .barline {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 6px 12px 7px;
    min-width: 148px;
  }
  .stat span {
    display: block;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .12em;
    color: var(--muted);
  }
  .stat b {
    display: block;
    margin-top: 1px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .01em;
  }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; }
  .seg { display: inline-flex; padding: 2px; background: #e9eef1; border-radius: 999px; }
  .seg button, .tools > button, .mini {
    border: 1px solid transparent;
    background: transparent;
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 12.5px;
    font-weight: 800;
    color: #4d5962;
  }
  .tools > button, .mini {
    background: #fff;
    border-color: var(--line);
  }
  .tools > button:hover, .mini:hover, .seg button:hover { border-color: #9fd4e0; color: #18788c; }
  .seg button.on { background: var(--teal); color: #fff; }
  .status { font-size: 12px; font-weight: 700; color: #8b949e; min-height: 1em; }
  .inspector { min-height: 38px; display: flex; align-items: center; }
  .hint { margin: 0; color: #7c868f; font-size: 13px; line-height: 1.45; }
  .hint b, .hint strong { color: #1d7d92; font-weight: 800; }
  .editor[hidden], .hint[hidden], .chip[hidden], .mini[hidden] { display: none !important; }
  .editor { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; width: 100%; }
  .who { min-width: 200px; }
  .who b { display: block; font-size: 16px; letter-spacing: .02em; color: var(--c); }
  .who small { color: #8b949e; font-weight: 700; }
  .note { flex: 1 1 280px; margin: 0; color: #66717a; font-size: 13px; line-height: 1.45; }
  .field { display: flex; flex-direction: column; gap: 2px; font-size: 10px; font-weight: 800; letter-spacing: .08em; color: #8b949e; }
  .field input {
    border: 1px solid #dce3e8;
    background: #fff;
    border-radius: 8px;
    padding: 5px 8px;
    font-weight: 700;
    letter-spacing: 0;
    color: var(--ink);
  }
  .dur {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 800;
  }
  .dur em { font-style: normal; color: #8b949e; font-weight: 700; }
  .scroll {
    flex: 1;
    min-height: 0;
    overflow: auto;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    position: relative;
  }
  .canvas { position: relative; min-height: 100%; }
  .head {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    background: #fff;
    box-shadow: 0 1px 0 var(--line);
  }
  .gutter {
    position: sticky;
    left: 0;
    z-index: 4;
    flex: 0 0 var(--gutter);
    width: var(--gutter);
    background: #fff;
  }
  .head .gutter {
    z-index: 6;
    display: flex;
    align-items: flex-end;
    padding: 0 12px 8px 10px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .16em;
    color: #9aa3ab;
  }
  .head-plot { position: relative; flex: none; }
  .months {
    display: flex;
    height: 46px;
    margin-top: 8px;
    background: var(--teal);
    color: #fff;
    border-radius: 12px;
    overflow: hidden;
  }
  .month {
    flex: none;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.05;
    min-width: 0;
  }
  .month + .month::before {
    content: "";
    position: absolute;
    left: 0;
    top: 9px;
    bottom: 9px;
    width: 1px;
    background: rgba(255,255,255,.45);
  }
  .month small { font-size: 10px; font-weight: 700; letter-spacing: .12em; opacity: .85; }
  .month b { font-size: 14px; font-weight: 800; letter-spacing: .06em; }
  .weekrow { position: relative; height: 22px; }
  .wlab {
    position: absolute;
    top: 4px;
    font-size: 10px;
    font-weight: 700;
    color: #9aa3ab;
    transform: translateX(-50%);
  }
  .today-pill {
    position: absolute;
    top: 2px;
    transform: translateX(-50%);
    background: #ef3d68;
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .04em;
    padding: 2px 6px;
    border-radius: 99px;
    z-index: 2;
    white-space: nowrap;
  }
  .phase, .row { display: flex; }
  .phase { height: 32px; margin-top: 8px; }
  .body > .phase:first-child { margin-top: 2px; }
  .phase .gutter {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 0 10px 6px 12px;
    color: var(--c);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .14em;
  }
  .phase em { font-style: normal; font-size: 10px; letter-spacing: .14em; opacity: .72; }
  .tick { width: 8px; height: 8px; border-radius: 99px; background: var(--c); margin-bottom: 2px; }
  .row { height: 68px; outline: none; }
  .row .gutter {
    display: grid;
    grid-template-columns: 34px 1fr;
    grid-template-rows: auto auto auto;
    column-gap: 4px;
    align-content: center;
    padding: 0 12px 0 10px;
    cursor: pointer;
    box-shadow: 8px 0 12px -12px rgba(40, 50, 70, .45);
  }
  .row.is-selected .gutter { background: #f3fbfc; }
  .row:hover .gutter { background: #f7fbfc; }
  .row.is-selected:hover .gutter { background: #f3fbfc; }
  .no {
    grid-column: 1;
    grid-row: 1 / span 3;
    align-self: center;
    font-weight: 800;
    font-size: 13px;
    color: var(--c);
    font-variant-numeric: tabular-nums;
  }
  .task-name, .task-en, .meta { grid-column: 2; min-width: 0; }
  .task-name {
    font-weight: 800;
    font-size: 14px;
    letter-spacing: .01em;
    color: var(--c);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.15;
  }
  .task-en {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .01em;
    color: #7d8790;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }
  .meta {
    color: #8b949e;
    font-size: 12px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 99px;
    background: var(--c);
    margin-right: 4px;
    transform: translateY(-1px);
  }
  .plot { position: relative; flex: none; height: 100%; }
  .bar, .ghost {
    position: absolute;
    top: 50%;
    height: 18px;
    margin-top: -9px;
    border-radius: 999px;
    touch-action: none;
  }
  .bar {
    background: var(--c);
    cursor: grab;
    z-index: 1;
  }
  .bar::before, .bar::after {
    content: "";
    position: absolute;
    top: 3px;
    bottom: 3px;
    width: 2px;
    border-radius: 2px;
    background: rgba(255,255,255,.8);
    pointer-events: none;
  }
  .bar::before { left: 8px; }
  .bar::after { right: 20px; }
  .bar.is-short::before, .bar.is-short::after { display: none; }
  .bar.is-selected { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--c); }
  .ghost {
    border: 1.5px dashed rgba(70, 80, 90, .45);
    background: transparent;
    z-index: 0;
    pointer-events: none;
  }
  .handle {
    position: absolute;
    top: -14px;
    bottom: -14px;
    z-index: 3;
    cursor: ew-resize;
  }
  .handle.start { left: -8px; width: 16px; }
  .handle.end { right: -8px; width: 16px; }
  .bar:not(.is-short) .handle.end { right: -16px; width: 36px; }
  .cap {
    position: absolute;
    width: 32px;
    height: 32px;
    right: -14px;
    top: 50%;
    margin-top: -16px;
    border-radius: 50%;
    background: #fff;
    color: var(--c);
    border: 2px solid var(--c);
    box-shadow: 0 3px 8px rgba(40, 50, 70, .12);
    display: grid;
    place-items: center;
    pointer-events: none;
    z-index: 2;
  }
  .cap svg, .lg-icon svg { width: 15px; height: 15px; display: block; }
  .legend {
    flex: none;
    background: #eef1f4;
    border-radius: 14px;
    padding: 10px 12px;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 8px 12px;
  }
  .lg { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .lg > span:last-child { min-width: 0; }
  .lg-icon {
    flex: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    display: grid;
    place-items: center;
    background: #fff;
  }
  .lg b { display: block; font-size: 12.5px; color: #5c6670; letter-spacing: .04em; }
  .lg small { display: block; color: #9199a1; font-size: 11px; line-height: 1.3; }
  .foot {
    flex: none;
    text-align: center;
    color: #a0a8b0;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .12em;
  }
  .chip {
    position: fixed;
    z-index: 80;
    pointer-events: none;
    background: #24323a;
    color: #fff;
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    box-shadow: 0 8px 20px rgba(20, 30, 40, .22);
    transform: translate(14px, -145%);
  }
  body.dragging, body.dragging * { cursor: grabbing !important; }
  body.dragging-resize, body.dragging-resize * { cursor: ew-resize !important; }
  @media (max-width: 1180px) {
    h1 { font-size: 30px; }
    .legend { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .client { display: none; }
  }
  @media print {
    body { height: auto; overflow: visible; background: #fff; }
    .wrap { height: auto; display: block; }
    .tools, .hint, .status, .chip { display: none !important; }
    .scroll { overflow: visible; border: 0; max-height: none; }
  }
</style>
</head>

      <div>

function parseDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function formatDate(d) {
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
}
function addDays(d, n) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
}
function diffDays(a, b) {
  const ua = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
  const ub = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((ub - ua) / 86400000);
}
function duration(a, b) {
  return diffDays(a, b) + 1;
}
function startOfMonth(d) {
  return new Date(d.getFullYear(), d.getMonth(), 1);
}
function endOfMonth(d) {
  return new Date(d.getFullYear(), d.getMonth() + 1, 0);
}
function fmtMD(d) {
  return `${d.getMonth() + 1}/${String(d.getDate()).padStart(2, "0")}`;
}
function fmtCN(d) {
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`;
}
function businessDays(a, b) {
  let n = 0;
  for (let d = new Date(a.getFullYear(), a.getMonth(), a.getDate()); d <= b; d = addDays(d, 1)) {
    const w = d.getDay();
    if (w !== 0 && w !== 6) n += 1;
  }
  return n;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function svg(name) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.seal}</svg>`;
}
function cloneTasks() {
  return DEFAULTS.map((t) => ({ ...t, start: parseDate(t.start), end: parseDate(t.end) }));
}
function taskById(id) {
  return tasks.find((t) => t.id === id);
}
function isTaskDirty(t) {
  const def = DEFAULT_BY_ID[t.id];
  return formatDate(t.start) !== def.start || formatDate(t.end) !== def.end;
}
function isDirty() {
  return tasks.some(isTaskDirty);
}
function clamp(n, a, b) {
  return Math.max(a, Math.min(b, n));
}
function todayDate() {
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
function eachMonth(start, end) {
  const out = [];
  let y = start.getFullYear();
  let m = start.getMonth();
  const last = end.getFullYear() * 12 + end.getMonth();
  while (y * 12 + m <= last) {
    const first = new Date(y, m, 1);
    const endDay = new Date(y, m + 1, 0);
    const from = first < start ? start : first;
    const to = endDay > end ? end : endDay;
    out.push({ year: y, month: m + 1, start: from, days: diffDays(from, to) + 1 });
    m += 1;
    if (m > 11) { m = 0; y += 1; }
  }
  return out;
}
function setStatus(msg) {
  statusEl.textContent = msg;
}

function clampTask(t, mode) {
  if (mode === "move") {
    if (t.start < MIN_DATE) {
      const s = diffDays(t.start, MIN_DATE);
      t.start = addDays(t.start, s);
      t.end = addDays(t.end, s);
    }
    if (t.end > MAX_DATE) {
      const s = diffDays(t.end, MAX_DATE);
      t.start = addDays(t.start, s);
      t.end = addDays(t.end, s);
    }
  } else {
    if (t.start < MIN_DATE) t.start = new Date(MIN_DATE);
    if (t.end > MAX_DATE) t.end = new Date(MAX_DATE);
    if (t.start > t.end) {
      if (mode === "start") t.start = new Date(t.end);
      else t.end = new Date(t.start);
    }
  }
}

function expandRange() {
  let changed = false;
  for (const t of tasks) {
    const s = startOfMonth(t.start);
    const e = endOfMonth(t.end);
    if (s < range.start) {
      scrollFix += diffDays(s, range.start) * px;
      range.start = s;
      changed = true;
    }
    if (e > range.end) {
      range.end = e;
      changed = true;
    }
  }
  return changed;
}

function fit() {
  const days = diffDays(range.start, range.end) + 1;
  const avail = Math.max(520, scroll.clientWidth - GUTTER - 8);
  px = clamp(avail / days, 2.2, 20);
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      v: 1,
      px,
      pxIsCustom,
      snap,
      range: [formatDate(range.start), formatDate(range.end)],
      tasks: Object.fromEntries(tasks.map((t) => [t.id, [formatDate(t.start), formatDate(t.end)]]))
    }));
    setStatus("");
  } catch (err) {
    setStatus("未能寫入本機儲存");
  }
}

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!raw || raw.v !== 1) return false;
    if (raw.tasks) {
      for (const t of tasks) {
        const pair = raw.tasks[t.id];
        if (!pair || pair.length !== 2) continue;
        const s = parseDate(pair[0]);
        const e = parseDate(pair[1]);
        if (Number.isNaN(s.getTime()) || Number.isNaN(e.getTime()) || s > e) continue;
        t.start = s;
        t.end = e;
      }
    }
    if (Array.isArray(raw.range) && raw.range.length === 2) {
      const s = parseDate(raw.range[0]);
      const e = parseDate(raw.range[1]);
      if (!Number.isNaN(s.getTime()) && !Number.isNaN(e.getTime()) && s < e) {
        range = { start: s, end: e };
      }
    }
    if (typeof raw.px === "number") px = clamp(raw.px, 2.2, 20);
    pxIsCustom = !!raw.pxIsCustom;
    if (raw.snap === "week" || raw.snap === "day") snap = raw.snap;
    return true;
  } catch (err) {
    return false;
  }
}

function plotStyle(days) {

    const x1 = x0 + m.days * px;
    monthStops.push(`${BANDS[i % BANDS.length]} ${x0}px ${x1}px`);
  });
  const lineStops = [];
  let cursor = 0;
  const pushGap = (to) => {
    if (to > cursor) lineStops.push(`transparent ${cursor}px ${to}px`);
  };
  for (let i = 0; i < days; i++) {
    const d = addDays(range.start, i);
    if (d.getDay() === 0 || d.getDate() === 1) {
      const lx = i * px;
      pushGap(lx);
      const color = d.getDate() === 1 ? "rgba(255,255,255,.95)" : "rgba(255,255,255,.7)";
      lineStops.push(`${color} ${lx}px ${lx + 1}px`);
      cursor = lx + 1;
    }
  }
  pushGap(total);
  const today = todayDate();
  const ti = diffDays(range.start, today);
  let todayGrad = "linear-gradient(to right, transparent, transparent)";
  if (ti >= 0 && ti < days) {
    const a = ti * px;
    const b = a + Math.max(px, 2);
    todayGrad = `linear-gradient(to right, transparent ${a}px, rgba(239,61,104,.18) ${a}px ${b}px, transparent ${b}px)`;
  }
  const monthGrad = `linear-gradient(to right, ${monthStops.join(",")})`;
  const lineGrad = `linear-gradient(to right, ${lineStops.join(",")})`;
  dyn.textContent = `.plot{background-image:${todayGrad},${lineGrad},${monthGrad};background-size:${total}px 100%,${total}px 100%,${total}px 100%;background-repeat:no-repeat;}`;
  return { days, total, months };
}

function metaHTML(t) {
  const dirty = isTaskDirty(t);
  return `${dirty ? '<i class="dot" title="已調整"></i>' : ""}${fmtMD(t.start)} – ${fmtMD(t.end)} · ${duration(t.start, t.end)}天`;
}

function renderChart() {
  const sl = scroll.scrollLeft + scrollFix;
  const st = scroll.scrollTop;
  scrollFix = 0;
  const days = diffDays(range.start, range.end) + 1;
  const bg = plotStyle(days);
  const timeW = bg.total + PAD;
  canvas.style.width = `${GUTTER + timeW}px`;

  const monthsHTML = bg.months.map((m) => `
    <div class="month" style="width:${m.days * px}px">
      <small>${m.year}</small>
      <b>${m.month}月</b>
    </div>`).join("");

  let weeks = "";
  if (px >= 3.4) {
    for (let i = 0; i < days; i++) {
      const d = addDays(range.start, i);
      if (d.getDay() === 0) {
        const shift = i === 0 ? "translateX(0)" : "translateX(-50%)";
        weeks += `<span class="wlab" style="left:${i * px}px;transform:${shift}">${d.getDate()}</span>`;
      }
    }
  }
  const today = todayDate();
  const ti = diffDays(range.start, today);
  if (ti >= 0 && ti < days) {
    weeks += `<span class="today-pill" style="left:${(ti + 0.5) * px}px">今天 ${today.getMonth() + 1}/${today.getDate()}</span>`;
  }

  let body = "";
  let n = 0;
  for (const phase of PHASES) {
    body += `<div class="phase" style="--c:${phase.color}">
      <div class="gutter"><i class="tick"></i><span>${phase.name}</span><em>${phase.en}</em></div>
      <div class="plot" style="width:${timeW}px"></div>
    </div>`;
    for (const t of tasks) {
      if (t.phase !== phase.id) continue;
      n += 1;
      const left = diffDays(range.start, t.start) * px;
      const width = Math.max(px, duration(t.start, t.end) * px);
      const short = width < 64;
      const selectedClass = t.id === selected ? " is-selected" : "";
      let ghost = "";
      if (drag && drag.id === t.id) {
        const gl = diffDays(range.start, drag.originStart) * px;
        const gw = Math.max(px, duration(drag.originStart, drag.originEnd) * px);
        ghost = `<div class="ghost" style="left:${gl}px;width:${gw}px"></div>`;
      }
      body += `<div class="row${selectedClass}" data-id="${t.id}" tabindex="0" style="--c:${phase.color}">
        <div class="gutter">
          <span class="no">${String(n).padStart(2, "0")}</span>
          <div class="task-name" title="${esc(t.note)}">${esc(t.name)}</div>
          <div class="task-en">${esc(t.en)}</div>
          <div class="meta">${metaHTML(t)}</div>
        </div>
        <div class="plot" style="width:${timeW}px">
          ${ghost}
          <div class="bar${short ? " is-short" : ""}${selectedClass}" style="left:${left}px;width:${width}px" aria-label="${esc(t.name)} ${esc(t.en)} ${formatDate(t.start)} 至 ${formatDate(t.end)}">
            <i class="handle start" data-resize="start"></i>
            <i class="handle end" data-resize="end"></i>
            <span class="cap">${svg(t.icon)}</span>
          </div>
        </div>
      </div>`;
    }
  }

  canvas.innerHTML = `
    <div class="head">
      <div class="gutter">工作項目　PROCESS</div>
      <div class="head-plot" style="width:${timeW}px">
        <div class="months" style="width:${bg.total}px">${monthsHTML}</div>
        <div class="weekrow" style="width:${bg.total}px">${weeks}</div>
      </div>
    </div>
    <div class="body">${body}</div>`;
  scroll.scrollLeft = sl;
  scroll.scrollTop = st;
}

function paintTask(t) {
  const row = canvas.querySelector(`[data-id="${t.id}"]`);
  if (!row) return false;
  const bar = row.querySelector(".bar");
  const left = diffDays(range.start, t.start) * px;
  const width = Math.max(px, duration(t.start, t.end) * px);
  bar.style.left = `${left}px`;
  bar.style.width = `${width}px`;
  bar.classList.toggle("is-short", width < 64);
  row.querySelector(".meta").innerHTML = metaHTML(t);
  const ghost = row.querySelector(".ghost");
  if (ghost && drag) {
    ghost.style.left = `${diffDays(range.start, drag.originStart) * px}px`;
    ghost.style.width = `${Math.max(px, duration(drag.originStart, drag.originEnd) * px)}px`;
  }
  return true;
}

function updateStats() {
  const contract = taskById("contract");
  const live = taskById("live");
  document.getElementById("statContract").textContent = fmtCN(contract.start);
  document.getElementById("statLive").textContent = fmtCN(live.start);
  const days = duration(contract.start, live.end);
  const months = Math.max(1, Math.round(days / 30.4));
  document.getElementById("statSpan").textContent = `${days} 天 · 約 ${months} 個月`;
}

function updateInspector() {
  const t = selected ? taskById(selected) : null;
  hint.hidden = !!t;
  editor.hidden = !t;
  if (!t) return;
  const phase = PHASE_BY_ID[t.phase];
  who.style.setProperty("--c", phase.color);
  whoName.textContent = `${t.name}　${t.en}`;
  whoEn.textContent = `${phase.name}　${phase.en}`;
  noteEl.textContent = t.note;
  const sv = formatDate(t.start);
  const ev = formatDate(t.end);
  if (document.activeElement !== startInput) startInput.value = sv;
  if (document.activeElement !== endInput) endInput.value = ev;
  const days = duration(t.start, t.end);
  durEl.innerHTML = `${days} 日曆日<br><em>${businessDays(t.start, t.end)} 工作天</em>`;
  restoreBtn.hidden = !isTaskDirty(t);
}

function renderLegend() {
  legend.innerHTML = PHASES.map((p) => `
    <div class="lg">
      <span class="lg-icon" style="color:${p.color}">${svg(p.icon)}</span>
      <span><b>${p.name}</b><small>${p.blurb}</small></span>
    </div>`).join("");
}

function syncSnapButtons() {
  document.getElementById("snapDay").classList.toggle("on", snap === "day");
  document.getElementById("snapWeek").classList.toggle("on", snap === "week");
}

function renderAll() {
  expandRange();
  renderChart();
  updateInspector();
  updateStats();
  syncSnapButtons();
}

function applyDrag() {
  const t = taskById(drag.id);
  const raw = (drag.cx - drag.x + (scroll.scrollLeft - drag.scroll0)) / px;
  const step = snap === "week" ? 7 : 1;
  const days = Math.round(raw / step) * step;
  if (drag.mode === "move") {
    t.start = addDays(drag.originStart, days);
    t.end = addDays(drag.originEnd, days);
  } else if (drag.mode === "start") {
    let ns = addDays(drag.originStart, days);
    if (ns > drag.originEnd) ns = new Date(drag.originEnd);
    t.start = ns;
    t.end = new Date(drag.originEnd);
  } else {
    let ne = addDays(drag.originEnd, days);
    if (ne < drag.originStart) ne = new Date(drag.originStart);
    t.end = ne;
    t.start = new Date(drag.originStart);
  }
  clampTask(t, drag.mode);
}

function chipText() {
  const t = taskById(drag.id);
  const days = duration(t.start, t.end);
  let change = "未移動";
  if (drag.mode === "move") {
    const d = diffDays(drag.originStart, t.start);
    change = d === 0 ? "未移動" : d > 0 ? `延後 ${d} 天` : `提早 ${-d} 天`;
  } else {
    const d = days - duration(drag.originStart, drag.originEnd);
    change = d === 0 ? "長度不變" : d > 0 ? `加長 ${d} 天` : `縮短 ${-d} 天`;
  }
  return `${t.name} / ${t.en}　${fmtMD(t.start)} → ${fmtMD(t.end)}　·　${days}天　·　${change}`;
}

function autoScroll() {
  const rect = scroll.getBoundingClientRect();
  const edge = 46;
  if (drag.cx > rect.right - 28) scroll.scrollLeft += 18;
  else if (drag.cx < rect.left + GUTTER + 20) scroll.scrollLeft -= 18;
  else if (drag.cx > rect.right - edge) scroll.scrollLeft += 10;
  else if (drag.cx < rect.left + GUTTER + edge) scroll.scrollLeft -= 10;
}

function loop() {
  if (!drag) return;
  const before = scroll.scrollLeft;
  autoScroll();
  if (scroll.scrollLeft !== before) paintDrag();
  raf = requestAnimationFrame(loop);
}

function endDrag(commit = true) {
  if (!drag) return;
  if (commit) applyDrag();
  const id = drag.id;
  drag = null;
  if (raf) cancelAnimationFrame(raf);
  raf = 0;
  chip.hidden = true;
  document.body.classList.remove("dragging", "dragging-resize");
  save();
  renderAll();
  const row = canvas.querySelector(`[data-id="${id}"]`);
  if (row) row.focus({ preventScroll: true });
}

function selectOnly(id) {
  selected = id;
  canvas.querySelectorAll(".row").forEach((r) => r.classList.toggle("is-selected", r.dataset.id === id));
  canvas.querySelectorAll(".bar").forEach((b) => b.classList.toggle("is-selected", b.closest(".row").dataset.id === id));
  updateInspector();
}

canvas.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  const handle = e.target.closest("[data-resize]");
  const bar = e.target.closest(".bar");
  const plot = e.target.closest(".plot");
  const row = e.target.closest("[data-id]");
  if (!row) return;
  if (!handle && !bar && !plot) {
    selectOnly(row.dataset.id);
    return;
  }
  e.preventDefault();
  const t = taskById(row.dataset.id);
  selected = t.id;
  drag = {
    id: t.id,
    mode: handle ? handle.dataset.resize : "move",
    x: e.clientX,
    cx: e.clientX,
    cy: e.clientY,
    scroll0: scroll.scrollLeft,
    originStart: new Date(t.start),
    originEnd: new Date(t.end)
  };
  document.body.classList.add(drag.mode === "move" ? "dragging" : "dragging-resize");
  renderChart();
  updateInspector();
  loop();
});

function paintDrag() {
  applyDrag();
  const t = taskById(drag.id);
  if (expandRange() || !paintTask(t)) renderChart();
  updateInspector();
  updateStats();
  chip.hidden = false;
  chip.style.left = `${drag.cx}px`;
  chip.style.top = `${drag.cy}px`;
  chip.textContent = chipText();
}
window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  e.preventDefault();
  drag.cx = e.clientX;
  drag.cy = e.clientY;
  paintDrag();
}, { passive: false });
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && drag) {
    const t = taskById(drag.id);
    t.start = new Date(drag.originStart);
    t.end = new Date(drag.originEnd);
    endDrag(false);
    return;
  }
  if (!selected) return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const row = e.target.closest ? e.target.closest("[data-id]") : null;
  if (!row) return;
  e.preventDefault();
  const dir = e.key === "ArrowLeft" ? -1 : 1;
  const step = (snap === "week" ? 7 : 1) * dir;
  const t = taskById(selected);
  if (e.shiftKey) {
    t.end = addDays(t.end, step);
    if (t.end < t.start) t.end = new Date(t.start);
    clampTask(t, "end");
  } else if (e.altKey) {
    t.start = addDays(t.start, step);
    if (t.start > t.end) t.start = new Date(t.end);
    clampTask(t, "start");
  } else {
    t.start = addDays(t.start, step);
    t.end = addDays(t.end, step);
    clampTask(t, "move");
  }
  save();
  renderAll();
  const again = canvas.querySelector(`[data-id="${t.id}"]`);
  if (again) again.focus({ preventScroll: true });
});

function commitInput(which) {
  const t = selected ? taskById(selected) : null;
  if (!t) return;
  const s = parseDate(startInput.value);
  const e = parseDate(endInput.value);
  if (Number.isNaN(s.getTime()) || Number.isNaN(e.getTime())) return;
  t.start = s;
  t.end = e;
  if (t.start > t.end) {
    if (which === "start") t.end = new Date(t.start);
    else t.start = new Date(t.end);
  }
  clampTask(t, "end");
  if (t.start < MIN_DATE) t.start = new Date(MIN_DATE);
  save();
  renderAll();
}
startInput.addEventListener("change", () => commitInput("start"));
endInput.addEventListener("change", () => commitInput("end"));

document.getElementById("snapDay").addEventListener("click", () => { snap = "day"; save(); syncSnapButtons(); });
document.getElementById("snapWeek").addEventListener("click", () => { snap = "week"; save(); syncSnapButtons(); });
document.getElementById("zoomOut").addEventListener("click", () => {
  pxIsCustom = true;
  px = clamp(px / 1.25, 2.2, 20);
  save();
  renderChart();
});
document.getElementById("zoomIn").addEventListener("click", () => {
  pxIsCustom = true;
  px = clamp(px * 1.25, 2.2, 20);
  save();
  renderChart();
});
document.getElementById("fitBtn").addEventListener("click", () => {
  pxIsCustom = false;
  fit();
  save();
  renderChart();
  setStatus("已縮放至全覽");
});
document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("還原成最初的計畫時間？你手動調整過的位置會清除。")) return;
  tasks = cloneTasks();
  range = { start: parseDate("2026-11-01"), end: parseDate("2027-06-30") };
  pxIsCustom = false;
  snap = "day";
  selected = null;
  try { localStorage.removeItem(KEY); } catch (err) { /* ignore */ }
  fit();
  renderAll();
  setStatus("已還原預設時間");
});
restoreBtn.addEventListener("click", () => {
  const t = selected ? taskById(selected) : null;
  if (!t) return;
  const def = DEFAULT_BY_ID[t.id];
  t.start = parseDate(def.start);
  t.end = parseDate(def.end);
  save();
  renderAll();
  setStatus("已還原此項");
});
document.getElementById("copyBtn").addEventListener("click", async () => {
  const lines = ["階段\t工作項目\t英文\t開始\t結束\t日曆日\t工作天\t說明"];
  for (const t of tasks) {
    const p = PHASE_BY_ID[t.phase];
    lines.push([p.name, t.name, t.en, formatDate(t.start), formatDate(t.end), duration(t.start, t.end), businessDays(t.start, t.end), t.note].join("\t"));
  }
  const text = lines.join("\n");
  try {
    await navigator.clipboard.writeText(text);
    setStatus("已複製，可貼到 Excel");
  } catch (err) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    setStatus("已複製，可貼到 Excel");
  }
});
document.getElementById("printBtn").addEventListener("click", () => window.print());

let resizeTimer = 0;
window.addEventListener("resize", () => {
  if (pxIsCustom || drag) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { fit(); renderChart(); }, 120);
});

function init() {
  document.documentElement.style.setProperty("--gutter", `${GUTTER}px`);
  const loaded = load();
  expandRange();
  if (loaded && !pxIsCustom) fit();
  renderLegend();
  renderAll();
  if (loaded && isDirty()) setStatus("已載入你上次調整的時間");
}
init();
</script>
</body>
</html>
